[project]
name = "easy-code"
version = "0.1.0"
description = "An AI coding assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.14",
    "langchain-openai>=0.2.15",
    "langchain-core>=0.3.24",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]